name: visible-feature-integration-once
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
concurrency:
  group: visible-feature-integration-once
  cancel-in-progress: true
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply user-visible integration
        run: python scripts/apply-visible-feature-integration.py
      - name: Validate frontend and visible contracts
        run: |
          npm install --ignore-scripts
          npm run build
          node scripts/ui-contract.mjs
          node scripts/visible-feature-contract.mjs
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate server service
        run: cargo check -p clinicdesk-server
      - name: Commit verified user-visible integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/SchedulingPage.tsx src/PatientsPage.tsx src/AppointmentsPage.tsx src/ReadOnlyAppointmentsPage.tsx src/Dashboard.tsx src/api.ts scripts/ui-contract.mjs scripts/visible-feature-contract.mjs src-tauri/src/appointments.rs src-tauri/src/lib.rs
          git commit -m "Expose approved appointments settings and print behavior in UI"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
