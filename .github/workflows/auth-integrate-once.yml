name: Auth integration one-shot
on:
  push:
    branches: [tauri-react-rebuild]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Add atomic auth integration patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - name: Integrate auth modules and commands
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          if 'pub mod auth;\n' not in text:
              text = text.replace(
                  'pub mod appointment_status;\n',
                  'pub mod appointment_status;\npub mod auth;\npub mod auth_commands;\n',
                  1,
              )
          marker = '            health,\n'
          commands = (
              '            auth_commands::auth_login,\n'
              '            auth_commands::auth_logout,\n'
              '            auth_commands::auth_validate_session,\n'
              '            auth_commands::user_list,\n'
              '            auth_commands::user_create,\n'
              '            auth_commands::user_update,\n'
              '            auth_commands::user_set_status,\n'
              '            auth_commands::user_reset_password,\n'
          )
          if 'auth_commands::auth_login,' not in text:
              if marker not in text:
                  raise SystemExit('invoke_handler marker not found')
              text = text.replace(marker, commands + marker, 1)
          path.write_text(text, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate authentication commands into Tauri runtime'
          git push origin HEAD:tauri-react-rebuild
