name: build
on:
  push:
    branches: [main, tauri-react-rebuild]
  pull_request:
    branches: [main]

concurrency:
  group: clinicdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - run: npm run build

  frontend-dependency-resolution:
    name: Frontend dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts

  rust-check:
    name: Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-tests-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-tests-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick
      - name: Generate Linux Tauri icon from canonical Windows icon
        run: convert 'src-tauri/icons/icon.ico[0]' src-tauri/icons/icon.png
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-clippy:
    name: Rust clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  migration-tests:
    name: SQLite migration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml migration_tests -- --nocapture

  attachment-tests:
    name: Attachment safety tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml attachments::tests -- --nocapture

  scheduling-tests:
    name: Scheduling tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml scheduling::tests -- --nocapture

  appointment-tests:
    name: Appointment tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml appointments::tests -- --nocapture

  patient-tests:
    name: Patient tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml patients::tests -- --nocapture

  gate:
    name: All checks passed
    if: always()
    needs:
      - frontend-build
      - frontend-dependency-resolution
      - rust-check
      - rust-tests-windows
      - rust-tests-linux
      - rust-clippy
      - rust-format
      - migration-tests
      - attachment-tests
      - scheduling-tests
      - appointment-tests
      - patient-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce green gate
        env:
          RESULTS: >-
            ${{ needs.frontend-build.result }}
            ${{ needs.frontend-dependency-resolution.result }}
            ${{ needs.rust-check.result }}
            ${{ needs.rust-tests-windows.result }}
            ${{ needs.rust-tests-linux.result }}
            ${{ needs.rust-clippy.result }}
            ${{ needs.rust-format.result }}
            ${{ needs.migration-tests.result }}
            ${{ needs.attachment-tests.result }}
            ${{ needs.scheduling-tests.result }}
            ${{ needs.appointment-tests.result }}
            ${{ needs.patient-tests.result }}
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = "success"
          done
