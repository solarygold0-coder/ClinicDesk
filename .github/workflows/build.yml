name: build
on:
  push:
    branches: [main, tauri-react-rebuild]
  pull_request:
    branches: [main]

concurrency:
  group: clinicdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - run: npm run build

  frontend-dependency-resolution:
    name: Frontend dependency resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts

  frontend-typescript:
    name: Frontend TypeScript strict check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx tsc --noEmit

  frontend-production-bundle:
    name: Frontend production bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build

  windows-package:
    name: Windows release package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Build Tauri release bundles
        run: npm run tauri -- build
      - name: Upload Windows release bundles
        uses: actions/upload-artifact@v4
        with:
          name: ClinicDesk-Windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  rust-check:
    name: Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-check-linux:
    name: Rust check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick
      - name: Generate RGBA Linux Tauri icon
        run: convert 'src-tauri/icons/icon.ico[0]' -alpha on -channel RGBA -depth 8 PNG32:src-tauri/icons/icon.png
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-tests-windows:
    name: Rust tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-tests-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick
      - name: Generate RGBA Linux Tauri icon from canonical Windows icon
        run: |
          convert 'src-tauri/icons/icon.ico[0]' -alpha on -channel RGBA -depth 8 PNG32:src-tauri/icons/icon.png
          identify -verbose src-tauri/icons/icon.png | grep -E 'Type: TrueColorAlpha|Alpha:'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-tests-release:
    name: Rust tests (release profile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml

  rust-clippy:
    name: Rust clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-clippy-linux:
    name: Rust clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf imagemagick
      - name: Generate RGBA Linux Tauri icon
        run: convert 'src-tauri/icons/icon.ico[0]' -alpha on -channel RGBA -depth 8 PNG32:src-tauri/icons/icon.png
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  migration-tests:
    name: SQLite migration tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml migration_tests -- --nocapture

  attachment-tests:
    name: Attachment safety tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml attachments::tests -- --nocapture

  scheduling-tests:
    name: Scheduling tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml scheduling::tests -- --nocapture

  appointment-tests:
    name: Appointment tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml appointments::tests -- --nocapture

  patient-tests:
    name: Patient tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml patients::tests -- --nocapture

  visit-tracking-tests:
    name: Visit tracking tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml visit_tracking -- --nocapture

  database-tests:
    name: Database integrity tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml database -- --nocapture

  security-tests:
    name: Security regression tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml security -- --nocapture

  gate:
    name: All checks passed
    if: always()
    needs:
      - frontend-build
      - frontend-dependency-resolution
      - frontend-typescript
      - frontend-production-bundle
      - windows-package
      - rust-check
      - rust-check-linux
      - rust-tests-windows
      - rust-tests-linux
      - rust-tests-release
      - rust-clippy
      - rust-clippy-linux
      - rust-format
      - migration-tests
      - attachment-tests
      - scheduling-tests
      - appointment-tests
      - patient-tests
      - visit-tracking-tests
      - database-tests
      - security-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce green gate
        env:
          RESULTS: >-
            ${{ needs.frontend-build.result }}
            ${{ needs.frontend-dependency-resolution.result }}
            ${{ needs.frontend-typescript.result }}
            ${{ needs.frontend-production-bundle.result }}
            ${{ needs.windows-package.result }}
            ${{ needs.rust-check.result }}
            ${{ needs.rust-check-linux.result }}
            ${{ needs.rust-tests-windows.result }}
            ${{ needs.rust-tests-linux.result }}
            ${{ needs.rust-tests-release.result }}
            ${{ needs.rust-clippy.result }}
            ${{ needs.rust-clippy-linux.result }}
            ${{ needs.rust-format.result }}
            ${{ needs.migration-tests.result }}
            ${{ needs.attachment-tests.result }}
            ${{ needs.scheduling-tests.result }}
            ${{ needs.appointment-tests.result }}
            ${{ needs.patient-tests.result }}
            ${{ needs.visit-tracking-tests.result }}
            ${{ needs.database-tests.result }}
            ${{ needs.security-tests.result }}
        shell: bash
        run: |
          for result in $RESULTS; do
            test "$result" = "success"
          done
