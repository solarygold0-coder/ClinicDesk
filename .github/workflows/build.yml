name: build
on:
  push:
    branches: [main, tauri-react-rebuild]
  pull_request:
    branches: [main]

concurrency:
  group: clinicdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rustfmt-autofix:
    name: Rustfmt autofix
    if: github.event_name == 'push' && github.ref == 'refs/heads/tauri-react-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and push rustfmt
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style: apply rustfmt"
          git push origin HEAD:tauri-react-rebuild

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run build

  rust-check:
    name: Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  rust-tests:
    name: Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-clippy:
    name: Rust clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  gate:
    name: All checks passed
    if: always()
    needs: [frontend-build, rust-check, rust-tests, rust-clippy, rust-format]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce green gate
        shell: bash
        run: |
          test "${{ needs.frontend-build.result }}" = "success"
          test "${{ needs.rust-check.result }}" = "success"
          test "${{ needs.rust-tests.result }}" = "success"
          test "${{ needs.rust-clippy.result }}" = "success"
          test "${{ needs.rust-format.result }}" = "success"
