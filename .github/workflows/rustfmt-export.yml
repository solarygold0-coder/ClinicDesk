name: Rustfmt Export

on:
  push:
    branches: [tauri-react-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-export:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit formatting fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/build.rs src-tauri/src/*.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt to Rust sources"
            git push origin HEAD:tauri-react-rebuild
          fi
