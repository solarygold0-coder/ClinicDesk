name: integrate-provider-unavailability
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
concurrency:
  group: integrate-provider-unavailability
  cancel-in-progress: true
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extend regression contract for provider unavailability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ui-contract.mjs')
          s = p.read_text()
          if "providerUnavailability: read('src/ProviderUnavailabilityPage.tsx')" not in s:
              s = s.replace(
                  "  attachments: read('src/PatientAttachments.tsx'),\n",
                  "  attachments: read('src/PatientAttachments.tsx'),\n  providerUnavailability: read('src/ProviderUnavailabilityPage.tsx'),\n  providerCss: read('src/provider-unavailability.css'),\n  providerRust: read('src-tauri/src/provider_unavailability.rs'),\n  providerMigration: read('src-tauri/migrations/017_provider_unavailability.sql'),\n  runtime: read('src-tauri/src/lib.rs'),\n",
              )
          s = s.replace(
              "files.scheduling, files.directory, files.attachments].join('\\n');",
              "files.scheduling, files.directory, files.attachments, files.providerUnavailability].join('\\n');",
          )
          marker = "  ['one-click patient action is wired', t.dashboard.includes('onClick={onPatientAdd}')],\n"
          provider_checks = """  ['provider unavailability navigation is visible only outside restricted clinical mode', files.app.includes('تعذّر المعالج') && t.app.includes(\"navigate('provider-unavailability')\") && t.app.includes(\"page==='provider-unavailability'&&!restrictedClinical&&<ProviderUnavailabilityPage/>\")],\n  ['provider unavailability stylesheet is loaded and responsive', files.main.includes(\"'./provider-unavailability.css'\") && t.providerCss.includes('.providerUnavailabilityPage') && t.providerCss.includes('@media(max-width:900px)')],\n  ['provider unavailability reasons are structured and other reason requires a note', ['leave','sudden_absence','assignment_meeting','emergency','other'].every((reason)=>files.providerUnavailability.includes(reason)) && files.providerUnavailability.includes(\"reasonCode === 'other'\") && files.providerUnavailability.includes('required={reasonCode === \'other\'}')],\n  ['provider unavailability supports transfer reschedule and classified cancellation', files.providerUnavailability.includes('تحويل لمعالج بديل') && files.providerUnavailability.includes('إعادة جدولة') && files.providerUnavailability.includes('إلغاء بسبب تعذّر المعالج') && t.api.includes(\"ProviderResolutionAction='transfer'|'reschedule'|'cancel'\")],\n  ['provider unavailability batches selected appointments atomically through one API call', files.providerUnavailability.includes('دفعة واحدة') && t.providerUnavailability.includes('api.resolveProviderUnavailability(event.id,resolutions)') && t.providerRust.includes('unchecked_transaction()')],\n  ['provider unavailability API commands use authenticated wrapper', t.api.includes(\"authed<ProviderUnavailabilityEvent>('provider_unavailability_create',{input})\") && t.api.includes(\"authed<AffectedAppointment[]>('provider_unavailability_affected',{eventId})\") && t.api.includes(\"authed<void>('provider_unavailability_resolve_many',{eventId,resolutions})\")],\n  ['provider unavailability backend checks working window replacement capacity and preserves classification', files.providerRust.includes('validate_work_window') && files.providerRust.includes('ensure_capacity') && files.providerRust.includes(\"disruption_kind='provider_unavailable'\") && files.providerRust.includes(\"disruption_resolution='cancel'\")],\n  ['provider unavailability schema 17 and Tauri runtime are registered end to end', files.providerMigration.includes('provider_unavailability_events') && files.providerMigration.includes('provider_unavailability_actions') && files.runtime.includes('const LATEST_SCHEMA_VERSION: i64 = 17;') && files.runtime.includes('../migrations/017_provider_unavailability.sql') && files.runtime.includes('provider_unavailability_resolve_many')],\n"""
          if "provider unavailability navigation is visible only outside restricted clinical mode" not in s:
              assert marker in s
              s = s.replace(marker, provider_checks + marker)
          s = s.replace('if (checks.length !== 62) {', 'if (checks.length !== 70) {')
          s = s.replace('exactly 62 checks', 'exactly 70 checks')
          p.write_text(s)
          PY
          node scripts/ui-contract.mjs
      - name: Commit protected contract and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-provider-unavailability.yml
          git add scripts/ui-contract.mjs
          git commit -m "Protect provider unavailability end-to-end requirements"
          git push origin HEAD:tauri-react-rebuild
