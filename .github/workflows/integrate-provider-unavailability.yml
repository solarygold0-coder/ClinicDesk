name: integrate-provider-unavailability
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
concurrency:
  group: integrate-provider-unavailability
  cancel-in-progress: true
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Complete provider unavailability resume flow and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src-tauri/src/provider_unavailability.rs')
          s = p.read_text()
          if 'pub fn list_open_events(' not in s:
              marker = 'pub fn affected_appointments(c: &Connection, event_id: i64) -> Result<Vec<AffectedAppointment>, String> {'
              insert = r'''pub fn list_open_events(c: &Connection) -> Result<Vec<ProviderUnavailabilityEvent>, String> {
    let mut stmt = c
        .prepare(
            "SELECT id,doctor_id,unavailable_from,unavailable_to,reason_code,reason_note,created_at,resolved_at
             FROM provider_unavailability_events
             WHERE resolved_at IS NULL
             ORDER BY unavailable_from DESC,id DESC",
        )
        .map_err(|e| e.to_string())?;
    let rows = stmt
        .query_map([], |r| {
            Ok(ProviderUnavailabilityEvent {
                id: r.get(0)?,
                doctor_id: r.get(1)?,
                unavailable_from: r.get(2)?,
                unavailable_to: r.get(3)?,
                reason_code: r.get(4)?,
                reason_note: r.get(5)?,
                created_at: r.get(6)?,
                resolved_at: r.get(7)?,
            })
        })
        .map_err(|e| e.to_string())?;
    rows.collect::<Result<Vec<_>, _>>().map_err(|e| e.to_string())
}

'''
              assert marker in s
              s = s.replace(marker, insert + marker)
          p.write_text(s)

          p = Path('src-tauri/src/lib.rs')
          s = p.read_text()
          if 'fn provider_unavailability_list_open(' not in s:
              marker = '#[tauri::command]\nfn provider_unavailability_create('
              command = '''#[tauri::command]\nfn provider_unavailability_list_open(\n    db: tauri::State<Db>,\n    actor_token: Option<String>,\n) -> Result<Vec<provider_unavailability::ProviderUnavailabilityEvent>, String> {\n    authorize_command(&db, actor_token.as_deref(), authorization::APPOINTMENT_READ)?;\n    with_db(&db, provider_unavailability::list_open_events)\n}\n'''
              assert marker in s
              s = s.replace(marker, command + marker)
          if '            provider_unavailability_list_open,\n' not in s:
              marker = '            provider_unavailability_create,\n'
              assert marker in s
              s = s.replace(marker, '            provider_unavailability_list_open,\n' + marker)
          p.write_text(s)

          p = Path('src/api.ts')
          s = p.read_text()
          if 'providerUnavailabilityOpen:' not in s:
              marker = "createProviderUnavailability:(input:ProviderUnavailabilityInput)=>authed<ProviderUnavailabilityEvent>('provider_unavailability_create',{input}),"
              assert marker in s
              s = s.replace(marker, "providerUnavailabilityOpen:()=>authed<ProviderUnavailabilityEvent[]>('provider_unavailability_list_open')," + marker)
          p.write_text(s)

          p = Path('src/ProviderUnavailabilityPage.tsx')
          s = p.read_text()
          if 'const [openEvents, setOpenEvents]' not in s:
              s = s.replace(
                  "  const [doctors, setDoctors] = useState<Doctor[]>([]);\n",
                  "  const [doctors, setDoctors] = useState<Doctor[]>([]);\n  const [openEvents, setOpenEvents] = useState<ProviderUnavailabilityEvent[]>([]);\n",
              )
          old_effect = '''  useEffect(() => {\n    api.doctors().then(setDoctors).catch((e) => setError(String(e)));\n  }, []);'''
          new_effect = '''  useEffect(() => {\n    Promise.all([api.doctors(), api.providerUnavailabilityOpen()])\n      .then(([doctorRows, eventRows]) => { setDoctors(doctorRows); setOpenEvents(eventRows); })\n      .catch((e) => setError(String(e)));\n  }, []);'''
          if old_effect in s:
              s = s.replace(old_effect, new_effect)
          if 'async function resumeEvent(' not in s:
              marker = '  async function registerEvent(e: FormEvent) {'
              resume = '''  async function resumeEvent(item: ProviderUnavailabilityEvent) {\n    if (busy) return;\n    setBusy(true);\n    setError('');\n    setMessage('');\n    try {\n      setEvent(item);\n      setDoctorId(String(item.doctorId));\n      setFrom(localDateTime(item.unavailableFrom));\n      setTo(localDateTime(item.unavailableTo));\n      setReasonCode(item.reasonCode);\n      setReasonNote(item.reasonNote || '');\n      await refreshAffected(item.id);\n      setMessage('تم استئناف حالة التعذّر المفتوحة وتحميل المواعيد التي ما زالت تحتاج معالجة.');\n    } catch (e) {\n      setEvent(null);\n      setError(String(e));\n    } finally {\n      setBusy(false);\n    }\n  }\n\n'''
              assert marker in s
              s = s.replace(marker, resume + marker)
          create_marker = '''      setEvent(created);\n      await refreshAffected(created.id);\n      setMessage('تم تسجيل تعذّر المعالج واستخراج المواعيد المتأثرة.');'''
          create_replacement = '''      setEvent(created);\n      setOpenEvents((current) => [created, ...current.filter((item) => item.id !== created.id)]);\n      await refreshAffected(created.id);\n      setMessage('تم تسجيل تعذّر المعالج واستخراج المواعيد المتأثرة.');'''
          if create_marker in s:
              s = s.replace(create_marker, create_replacement)
          resolve_marker = '''      await api.resolveProviderUnavailability(event.id, resolutions);\n      await refreshAffected(event.id);\n      setMessage(`تمت معالجة ${resolutions.length} موعد/مواعيد دفعة واحدة مع حفظ دورة الحياة.`);'''
          resolve_replacement = '''      await api.resolveProviderUnavailability(event.id, resolutions);\n      const remaining = await api.providerUnavailabilityAffected(event.id);\n      setAffected(remaining);\n      initializeDrafts(remaining);\n      if (remaining.length === 0) {\n        setOpenEvents((current) => current.filter((item) => item.id !== event.id));\n        setMessage(`تمت معالجة ${resolutions.length} موعد/مواعيد وإغلاق حالة التعذّر بالكامل.`);\n      } else {\n        setMessage(`تمت معالجة ${resolutions.length} موعد/مواعيد دفعة واحدة مع حفظ دورة الحياة.`);\n      }'''
          if resolve_marker in s:
              s = s.replace(resolve_marker, resolve_replacement)
          reset_marker = '''    setReasonCode('sudden_absence');\n    setReasonNote('');\n  }'''
          reset_replacement = '''    setReasonCode('sudden_absence');\n    setReasonNote('');\n    void api.providerUnavailabilityOpen().then(setOpenEvents).catch((e) => setError(String(e)));\n  }'''
          if reset_marker in s:
              s = s.replace(reset_marker, reset_replacement, 1)
          notice_marker = '''      {message && <div className="notice" role="status">{message}</div>}\n\n      {!event ? ('''
          notice_replacement = '''      {message && <div className="notice" role="status">{message}</div>}\n\n      {!event && openEvents.length > 0 && <div className="notice providerOpenEvents">\n        <strong>حالات تعذّر مفتوحة تحتاج استكمال</strong>\n        <div className="providerOpenEventList">{openEvents.map((item) => <button type="button" key={item.id} disabled={busy} onClick={() => void resumeEvent(item)}>استئناف {doctors.find((doctor) => doctor.id === item.doctorId)?.name || `المعالج #${item.doctorId}`} — {displayDateTime(item.unavailableFrom)}</button>)}</div>\n      </div>}\n\n      {!event ? ('''
          if notice_marker in s:
              s = s.replace(notice_marker, notice_replacement)
          old_display = '''const displayDateTime = (value: string) =>\n  new Date(value).toLocaleString('ar-SA-u-ca-gregory', {\n    weekday: 'long',\n    year: 'numeric',\n    month: 'long',\n    day: 'numeric',\n    hour: '2-digit',\n    minute: '2-digit',\n  });'''
          new_display = '''const displayDateTime = (value: string) => {\n  const date = new Date(value);\n  const text = date.toLocaleString('ar-SA-u-ca-gregory', {\n    weekday: 'long',\n    year: 'numeric',\n    month: 'long',\n    day: 'numeric',\n    hour: '2-digit',\n    minute: '2-digit',\n  });\n  return `${text} • الشهر ${String(date.getMonth() + 1).padStart(2, '0')}`;\n};'''
          if old_display in s:
              s = s.replace(old_display, new_display)
          p.write_text(s)

          p = Path('scripts/ui-contract.mjs')
          s = p.read_text()
          if "providerUnavailability: read('src/ProviderUnavailabilityPage.tsx')" not in s:
              s = s.replace(
                  "  attachments: read('src/PatientAttachments.tsx'),\n",
                  "  attachments: read('src/PatientAttachments.tsx'),\n  providerUnavailability: read('src/ProviderUnavailabilityPage.tsx'),\n  providerCss: read('src/provider-unavailability.css'),\n  providerRust: read('src-tauri/src/provider_unavailability.rs'),\n  providerMigration: read('src-tauri/migrations/017_provider_unavailability.sql'),\n  runtime: read('src-tauri/src/lib.rs'),\n",
              )
          s = s.replace(
              "files.scheduling, files.directory, files.attachments].join('\\n');",
              "files.scheduling, files.directory, files.attachments, files.providerUnavailability].join('\\n');",
          )
          marker = "  ['one-click patient action is wired', t.dashboard.includes('onClick={onPatientAdd}')],\n"
          provider_checks = """  ['provider unavailability navigation is visible only outside restricted clinical mode', files.app.includes('تعذّر المعالج') && t.app.includes(\"navigate('provider-unavailability')\") && t.app.includes(\"page==='provider-unavailability'&&!restrictedClinical&&<ProviderUnavailabilityPage/>\")],\n  ['provider unavailability stylesheet is loaded and responsive', files.main.includes(\"'./provider-unavailability.css'\") && t.providerCss.includes('.providerUnavailabilityPage') && t.providerCss.includes('@media(max-width:900px)')],\n  ['provider unavailability reasons are structured and other reason requires a note', ['leave','sudden_absence','assignment_meeting','emergency','other'].every((reason)=>files.providerUnavailability.includes(reason)) && files.providerUnavailability.includes(\"reasonCode === 'other'\") && files.providerUnavailability.includes('required={reasonCode === \'other\'}')],\n  ['provider unavailability supports transfer reschedule and classified cancellation', files.providerUnavailability.includes('تحويل لمعالج بديل') && files.providerUnavailability.includes('إعادة جدولة') && files.providerUnavailability.includes('إلغاء بسبب تعذّر المعالج') && t.api.includes(\"ProviderResolutionAction='transfer'|'reschedule'|'cancel'\")],\n  ['provider unavailability batches selected appointments atomically through one API call', files.providerUnavailability.includes('دفعة واحدة') && t.providerUnavailability.includes('api.resolveProviderUnavailability(event.id,resolutions)') && t.providerRust.includes('unchecked_transaction()')],\n  ['provider unavailability API commands use authenticated wrapper', t.api.includes(\"authed<ProviderUnavailabilityEvent>('provider_unavailability_create',{input})\") && t.api.includes(\"authed<AffectedAppointment[]>('provider_unavailability_affected',{eventId})\") && t.api.includes(\"authed<void>('provider_unavailability_resolve_many',{eventId,resolutions})\")],\n  ['provider unavailability open events can be resumed after restart', t.api.includes(\"providerUnavailabilityOpen:()=>authed<ProviderUnavailabilityEvent[]>('provider_unavailability_list_open')\") && t.providerUnavailability.includes('حالات تعذّر مفتوحة تحتاج استكمال') && t.providerUnavailability.includes('resumeEvent(item)')],\n  ['provider unavailability backend exposes authenticated open-event listing', t.providerRust.includes('pub fn list_open_events') && files.runtime.includes('provider_unavailability_list_open')],\n  ['provider unavailability backend checks working window replacement capacity and preserves classification', files.providerRust.includes('validate_work_window') && files.providerRust.includes('ensure_capacity') && files.providerRust.includes(\"disruption_kind='provider_unavailable'\") && files.providerRust.includes(\"disruption_resolution='cancel'\")],\n  ['provider unavailability schema 17 and Tauri runtime are registered end to end', files.providerMigration.includes('provider_unavailability_events') && files.providerMigration.includes('provider_unavailability_actions') && files.runtime.includes('const LATEST_SCHEMA_VERSION: i64 = 17;') && files.runtime.includes('../migrations/017_provider_unavailability.sql') && files.runtime.includes('provider_unavailability_resolve_many')],\n"""
          if "provider unavailability navigation is visible only outside restricted clinical mode" not in s:
              assert marker in s
              s = s.replace(marker, provider_checks + marker)
          elif "provider unavailability open events can be resumed after restart" not in s:
              existing = "  ['provider unavailability backend checks working window replacement capacity and preserves classification'"
              extra = "  ['provider unavailability open events can be resumed after restart', t.api.includes(\"providerUnavailabilityOpen:()=>authed<ProviderUnavailabilityEvent[]>('provider_unavailability_list_open')\") && t.providerUnavailability.includes('حالات تعذّر مفتوحة تحتاج استكمال') && t.providerUnavailability.includes('resumeEvent(item)')],\n  ['provider unavailability backend exposes authenticated open-event listing', t.providerRust.includes('pub fn list_open_events') && files.runtime.includes('provider_unavailability_list_open')],\n"
              assert existing in s
              s = s.replace(existing, extra + existing)
          for old in ['if (checks.length !== 62) {', 'if (checks.length !== 70) {']:
              s = s.replace(old, 'if (checks.length !== 72) {')
          s = s.replace('exactly 62 checks', 'exactly 72 checks')
          s = s.replace('exactly 70 checks', 'exactly 72 checks')
          p.write_text(s)
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          node scripts/ui-contract.mjs
      - name: Commit protected contract and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-provider-unavailability.yml
          git add src-tauri/src/provider_unavailability.rs src-tauri/src/lib.rs src/api.ts src/ProviderUnavailabilityPage.tsx scripts/ui-contract.mjs
          git commit -m "Complete provider unavailability resume flow"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
