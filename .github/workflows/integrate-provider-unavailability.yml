name: integrate-provider-unavailability
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
concurrency:
  group: integrate-provider-unavailability
  cancel-in-progress: true
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - name: Wire frontend API, navigation and stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/api.ts')
          s = p.read_text()
          type_marker = "export type AppointmentInput={patientFileNo:number;clinicId?:number;doctorId?:number;startsAt:string;durationMinutes:number;notes?:string};\n"
          provider_types = """export type ProviderUnavailabilityReason='leave'|'sudden_absence'|'assignment_meeting'|'emergency'|'other';\nexport type ProviderUnavailabilityInput={doctorId:number;unavailableFrom:string;unavailableTo:string;reasonCode:ProviderUnavailabilityReason;reasonNote?:string};\nexport type ProviderUnavailabilityEvent={id:number;doctorId:number;unavailableFrom:string;unavailableTo:string;reasonCode:ProviderUnavailabilityReason;reasonNote?:string;createdAt:string;resolvedAt?:string};\nexport type AffectedAppointment={appointmentId:number;patientId:number;fileNo:number;patientName:string;clinicId?:number;doctorId?:number;startsAt:string;endsAt:string;status:string};\nexport type ProviderResolutionAction='transfer'|'reschedule'|'cancel';\nexport type ProviderResolutionInput={appointmentId:number;actionType:ProviderResolutionAction;replacementDoctorId?:number;newStartsAt?:string};\n"""
          if 'export type ProviderUnavailabilityReason=' not in s:
              assert type_marker in s
              s = s.replace(type_marker, type_marker + provider_types)
          api_marker = "appointmentStatus:(id:number,status:string)=>authed<void>('appointment_status',{id,status}),"
          provider_api = "createProviderUnavailability:(input:ProviderUnavailabilityInput)=>authed<ProviderUnavailabilityEvent>('provider_unavailability_create',{input}),providerUnavailabilityAffected:(eventId:number)=>authed<AffectedAppointment[]>('provider_unavailability_affected',{eventId}),resolveProviderUnavailability:(eventId:number,resolutions:ProviderResolutionInput[])=>authed<void>('provider_unavailability_resolve_many',{eventId,resolutions}),"
          if 'createProviderUnavailability:' not in s:
              assert api_marker in s
              s = s.replace(api_marker, api_marker + provider_api)
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace(
              "import { Building2, CalendarDays, FileClock, LayoutDashboard, LogOut, Settings, UserCog, Users } from 'lucide-react';",
              "import { AlertTriangle, Building2, CalendarDays, FileClock, LayoutDashboard, LogOut, Settings, UserCog, Users } from 'lucide-react';",
          )
          if "import { ProviderUnavailabilityPage } from './ProviderUnavailabilityPage';" not in s:
              s = s.replace("import { AuditPage } from './AuditPage';\n", "import { AuditPage } from './AuditPage';\nimport { ProviderUnavailabilityPage } from './ProviderUnavailabilityPage';\n")
          s = s.replace(
              "type Page='dashboard'|'patients'|'appointments'|'directory'|'settings'|'users'|'audit';",
              "type Page='dashboard'|'patients'|'appointments'|'provider-unavailability'|'directory'|'settings'|'users'|'audit';",
          )
          nav_marker = "        <button aria-current={page==='appointments'?'page':undefined} aria-keyshortcuts=\"Alt+3\" className={page==='appointments'?'active':''} onClick={openAppointments}><CalendarDays aria-hidden=\"true\"/>المواعيد</button>\n"
          nav_provider = "        {!restrictedClinical&&<button aria-current={page==='provider-unavailability'?'page':undefined} className={page==='provider-unavailability'?'active':''} onClick={()=>navigate('provider-unavailability')}><AlertTriangle aria-hidden=\"true\"/>تعذّر المعالج</button>}\n"
          if "page==='provider-unavailability'?'page':undefined" not in s:
              assert nav_marker in s
              s = s.replace(nav_marker, nav_marker + nav_provider)
          main_marker = "      {page==='appointments'&&(restrictedClinical?<ReadOnlyAppointmentsPage/>:<AppointmentsPage onPatient={openPatients} action={appointmentAction}/>)} \n"
          main_provider = "      {page==='provider-unavailability'&&!restrictedClinical&&<ProviderUnavailabilityPage/>} \n"
          if "<ProviderUnavailabilityPage/>" not in s:
              assert main_marker in s
              s = s.replace(main_marker, main_marker + main_provider)
          p.write_text(s)

          p = Path('src/main.tsx')
          s = p.read_text()
          if "import './provider-unavailability.css';" not in s:
              s = s.replace("import './accountability.css';\n", "import './accountability.css';\nimport './provider-unavailability.css';\n")
          p.write_text(s)
          PY
      - name: Commit frontend integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.ts src/App.tsx src/main.tsx
          git commit -m "Expose provider unavailability workflow in application UI"
          git push origin HEAD:tauri-react-rebuild
