name: Fix provider unavailability clippy

on:
  push:
    branches: [tauri-react-rebuild]

permissions:
  contents: write

concurrency:
  group: fix-provider-clippy
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor action audit arguments
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/provider_unavailability.rs')
          s = path.read_text(encoding='utf-8')

          marker = 'fn record_action(\n'
          if marker not in s:
              raise SystemExit('record_action not found')

          struct_def = '''struct ActionRecordDetails<'a> {\n    action_type: &'a str,\n    replacement_doctor_id: Option<i64>,\n    new_starts_at: Option<&'a str>,\n    replacement_appointment_id: Option<i64>,\n}\n\n'''
          if 'struct ActionRecordDetails' not in s:
              s = s.replace(marker, struct_def + marker, 1)

          old_sig = '''fn record_action(\n    c: &Connection,\n    event: &ProviderUnavailabilityEvent,\n    before: &AppointmentSnapshot,\n    after: &AppointmentSnapshot,\n    action_type: &str,\n    replacement_doctor_id: Option<i64>,\n    new_starts_at: Option<&str>,\n    replacement_appointment_id: Option<i64>,\n) -> Result<(), String> {'''
          new_sig = '''fn record_action(\n    c: &Connection,\n    event: &ProviderUnavailabilityEvent,\n    before: &AppointmentSnapshot,\n    after: &AppointmentSnapshot,\n    details: ActionRecordDetails<'_>,\n) -> Result<(), String> {'''
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          elif new_sig not in s:
              raise SystemExit('record_action signature anchor not found')

          start = s.index(new_sig)
          end = s.index('\nfn transfer(', start)
          region = s[start:end]
          region = region.replace('action_type', 'details.action_type')
          region = region.replace('replacement_doctor_id', 'details.replacement_doctor_id')
          region = region.replace('new_starts_at', 'details.new_starts_at')
          region = region.replace('replacement_appointment_id', 'details.replacement_appointment_id')
          s = s[:start] + region + s[end:]

          old_transfer = '''    record_action(\n        c,\n        event,\n        &before,\n        &after,\n        "transfer",\n        Some(replacement_doctor_id),\n        Some(&after.starts_at),\n        None,\n    )'''
          new_transfer = '''    record_action(\n        c,\n        event,\n        &before,\n        &after,\n        ActionRecordDetails {\n            action_type: "transfer",\n            replacement_doctor_id: Some(replacement_doctor_id),\n            new_starts_at: Some(&after.starts_at),\n            replacement_appointment_id: None,\n        },\n    )'''
          if old_transfer in s:
              s = s.replace(old_transfer, new_transfer, 1)

          old_cancel = '    record_action(c, event, &before, &after, "cancel", None, None, None)'
          new_cancel = '''    record_action(\n        c,\n        event,\n        &before,\n        &after,\n        ActionRecordDetails {\n            action_type: "cancel",\n            replacement_doctor_id: None,\n            new_starts_at: None,\n            replacement_appointment_id: None,\n        },\n    )'''
          if old_cancel in s:
              s = s.replace(old_cancel, new_cancel, 1)

          old_reschedule = '''    record_action(\n        c,\n        event,\n        &before,\n        &after,\n        "reschedule",\n        Some(target_doctor),\n        Some(&new_start_text),\n        Some(replacement_id),\n    )?;'''
          new_reschedule = '''    record_action(\n        c,\n        event,\n        &before,\n        &after,\n        ActionRecordDetails {\n            action_type: "reschedule",\n            replacement_doctor_id: Some(target_doctor),\n            new_starts_at: Some(&new_start_text),\n            replacement_appointment_id: Some(replacement_id),\n        },\n    )?;'''
          if old_reschedule in s:
              s = s.replace(old_reschedule, new_reschedule, 1)

          if 'fn record_action(\n    c: &Connection,\n    event: &ProviderUnavailabilityEvent,\n    before: &AppointmentSnapshot,\n    after: &AppointmentSnapshot,\n    details: ActionRecordDetails' not in s:
              raise SystemExit('refactor did not apply')
          if 'record_action(c, event, &before, &after, "cancel"' in s:
              raise SystemExit('cancel call not refactored')

          path.write_text(s, encoding='utf-8')
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-provider-clippy.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/provider_unavailability.rs
          git diff --cached --check
          git commit -m "Refactor provider action audit details"
          git push origin HEAD:tauri-react-rebuild
