name: Repair patient rustfmt

on:
  workflow_dispatch:
  push:
    branches: [tauri-react-rebuild]
    paths: ['.github/workflows/repair-patient-rustfmt.yml']

permissions:
  contents: write

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Remove temporary repair workflow
        run: rm .github/workflows/repair-patient-rustfmt.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/patients.rs .github/workflows/repair-patient-rustfmt.yml
          git commit -m 'fix: apply rustfmt to patient inactivity detection'
          git push origin HEAD:tauri-react-rebuild
