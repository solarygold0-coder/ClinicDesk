name: format-repair-current
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "Apply canonical Rust formatting to attachment gate"
          git push origin HEAD:tauri-react-rebuild
