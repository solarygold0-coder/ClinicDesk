name: provider-resume-once
on:
  push:
    branches:
      - tauri-react-rebuild
permissions:
  contents: write
concurrency:
  group: provider-resume-once
  cancel-in-progress: true
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply resume-after-restart patch
        run: python scripts/apply-provider-resume.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Correct behavior-based resume contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ui-contract.mjs')
          s = p.read_text()
          s = s.replace("t.providerRust.includes('pub fn list_open_events')", "files.providerRust.includes('pub fn list_open_events')")
          p.write_text(s)
          PY
      - name: Validate UI and TypeScript
        run: |
          npm install --ignore-scripts
          npm run build
          node scripts/ui-contract.mjs
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/provider-resume-once.yml scripts/apply-provider-resume.py
          git add src-tauri/src/provider_unavailability.rs src-tauri/src/lib.rs src/api.ts src/ProviderUnavailabilityPage.tsx scripts/ui-contract.mjs
          git commit -m "Enable provider unavailability resume after restart"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
