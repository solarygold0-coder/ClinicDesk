name: apply-reference-patch-and-build

on:
  push:
    branches:
      - reference/local-fixes-on-c9611579

permissions:
  contents: write

concurrency:
  group: apply-reference-patch-and-build
  cancel-in-progress: true

jobs:
  apply-validate-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout reference branch
        uses: actions/checkout@v4
        with:
          ref: reference/local-fixes-on-c9611579
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - id: reassemble
        name: Reassemble and verify reference patch
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma

          parts = [
              Path(".clinicdesk-handoff/patch-09c65e4.xz.b64.00"),
              Path(".clinicdesk-handoff/patch-09c65e4.xz.b64.01"),
              Path(".clinicdesk-handoff/patch-09c65e4.xz.b64.02"),
          ]
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          raw = lzma.decompress(base64.b64decode(encoded))
          actual = hashlib.sha256(raw).hexdigest()
          expected = "4fc98732a2cb0fe79bf8e47ada87fd8500a60785e0322be98844ab04efb575a1"
          if actual != expected:
              raise SystemExit(f"Patch SHA-256 mismatch: {actual}")
          Path("09c65e4-local-fixes.patch").write_bytes(raw)
          print(f"Verified patch: {len(raw)} bytes, SHA-256 {actual}")

      - id: patch
        name: Apply local fixes patch
        if: steps.reassemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git apply --check 09c65e4-local-fixes.patch
          git apply --whitespace=nowarn 09c65e4-local-fixes.patch

      - id: lock
        name: Normalize npm lockfile registry URLs
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path("package-lock.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          changed = 0
          for key, meta in data.get("packages", {}).items():
              resolved = meta.get("resolved")
              version = meta.get("version")
              if not resolved or not version or "35.245.43.102" not in resolved:
                  continue
              package = key.split("node_modules/")[-1].strip("/")
              if not package:
                  continue
              tar_name = package.split("/")[-1]
              meta["resolved"] = f"https://registry.npmjs.org/{package}/-/{tar_name}-{version}.tgz"
              changed += 1
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Normalized {changed} resolved package URLs")

      - id: npmci
        name: Install frontend dependencies
        if: steps.lock.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm ci

      - id: frontend
        name: Frontend build
        if: steps.npmci.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm run build

      - id: uicontract
        name: UI contract
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm run test:ui-contract

      - id: rustfmt
        name: Rust format
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - id: clippy
        name: Rust clippy
        if: steps.rustfmt.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - id: rusttest
        name: Rust tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - id: tauri
        name: Build Windows MSI and NSIS
        if: steps.uicontract.outcome == 'success' && steps.rusttest.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm run tauri -- build

      - name: Write diagnostic failure report
        if: always() && steps.tauri.outcome != 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/reference | Out-Null
          @"
          # Reference branch CI diagnostic

          Commit under test: $env:GITHUB_SHA
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          - reassemble: ${{ steps.reassemble.outcome }}
          - patch: ${{ steps.patch.outcome }}
          - lock normalization: ${{ steps.lock.outcome }}
          - npm ci: ${{ steps.npmci.outcome }}
          - frontend build: ${{ steps.frontend.outcome }}
          - UI contract: ${{ steps.uicontract.outcome }}
          - rustfmt: ${{ steps.rustfmt.outcome }}
          - clippy: ${{ steps.clippy.outcome }}
          - rust tests: ${{ steps.rusttest.outcome }}
          - tauri windows build: ${{ steps.tauri.outcome }}
          "@ | Out-File -Encoding utf8 docs/reference/CI-LAST-FAILURE.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/CI-LAST-FAILURE.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record reference branch CI failure"
            git push origin HEAD:reference/local-fixes-on-c9611579
          }
          exit 1

      - name: Collect installer hashes
        if: steps.tauri.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.FullName)"
          } | Out-File -Encoding utf8 SHA256SUMS-reference-build.txt

      - name: Upload Windows installers
        if: steps.tauri.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ClinicDesk-reference-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-reference-build.txt
          if-no-files-found: error

      - name: Push clean verified source commit
        if: steps.tauri.outcome == 'success'
        shell: pwsh
        run: |
          if (Test-Path ".clinicdesk-handoff") { Remove-Item -Recurse -Force ".clinicdesk-handoff" }
          if (Test-Path "09c65e4-local-fixes.patch") { Remove-Item -Force "09c65e4-local-fixes.patch" }
          if (Test-Path ".github/workflows/apply-reference-patch-and-build.yml") { Remove-Item -Force ".github/workflows/apply-reference-patch-and-build.yml" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply verified local fixes from 09c65e4"
          git push origin HEAD:reference/local-fixes-on-c9611579
