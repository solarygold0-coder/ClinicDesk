name: unify-date-display-once
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical date display
        run: python scripts/apply-date-display.py
      - name: Validate frontend and contracts
        run: |
          npm install --ignore-scripts
          npm run build
          node scripts/ui-contract.mjs
          node scripts/audit-label-contract.mjs
          node scripts/appointment-advisory-contract.mjs
          node scripts/two-day-reminder-contract.mjs
          node scripts/full-date-display-contract.mjs
      - name: Commit verified date integration and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/unify-date-display-once.yml scripts/apply-date-display.py
          git add src/PatientsPage.tsx src/AppointmentsPage.tsx src/ReadOnlyAppointmentsPage.tsx src/Dashboard.tsx scripts/full-date-display-contract.mjs .github/workflows/ui-contract.yml
          git commit -m "Unify full Gregorian date display across application"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
