name: Format repair once
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit canonical formatting and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/format-repair-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src .github/workflows/format-repair-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply canonical Rust formatting"
          git push origin HEAD:tauri-react-rebuild
