name: One-shot Rust formatting repair

on:
  push:
    branches: [tauri-react-rebuild]
    paths: [.github/workflows/format-repair-once.yml]

permissions:
  contents: write

jobs:
  format-and-remove-self:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting and remove one-shot workflow
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git rm .github/workflows/format-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/security_log.rs
          git commit -m "Apply canonical Rust formatting after command surface repair"
          git push origin HEAD:tauri-react-rebuild
