name: Authorization integration one-shot
on:
  push:
    branches: [tauri-react-rebuild]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Retry backend authorization integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - name: Protect Tauri commands with backend capabilities
        shell: python
        run: |
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          if 'pub mod authorization;\n' not in text:
              text = text.replace(
                  'pub mod auth_commands;\n',
                  'pub mod auth_commands;\npub mod authorization;\n',
                  1,
              )

          helper_marker = '#[tauri::command]\nfn health()'
          if 'fn authorize_command(' not in text:
              helper = '''fn authorize_command(
              db: &tauri::State<Db>,
              actor_token: Option<&str>,
              capability: &str,
          ) -> Result<(), String> {
              with_db(db, |conn| {
                  authorization::authorize(conn, actor_token, capability)?;
                  Ok(())
              })
          }
          '''
              if helper_marker not in text:
                  raise SystemExit('health marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          capabilities = {
              'patient_list': 'PATIENT_READ',
              'patient_count': 'PATIENT_READ',
              'patient_by_file_no': 'PATIENT_READ',
              'patient_inactive': 'PATIENT_READ',
              'patient_create': 'PATIENT_WRITE',
              'patient_update': 'PATIENT_WRITE',
              'patient_delete': 'PATIENT_WRITE',
              'patient_future_appointment_count': 'PATIENT_READ',
              'clinic_list': 'DIRECTORY_READ',
              'clinic_create': 'DIRECTORY_WRITE',
              'clinic_update': 'DIRECTORY_WRITE',
              'clinic_delete': 'DIRECTORY_WRITE',
              'doctor_list': 'DIRECTORY_READ',
              'doctor_create': 'DIRECTORY_WRITE',
              'doctor_update': 'DIRECTORY_WRITE',
              'doctor_delete': 'DIRECTORY_WRITE',
              'appointment_list': 'APPOINTMENT_READ',
              'appointment_missed_history': 'APPOINTMENT_READ',
              'appointment_upcoming_all': 'APPOINTMENT_READ',
              'patient_appointments': 'APPOINTMENT_READ',
              'appointment_create': 'APPOINTMENT_WRITE',
              'appointment_update': 'APPOINTMENT_WRITE',
              'appointment_status': 'APPOINTMENT_WRITE',
              'visit_tracking_update': 'VISIT_WRITE',
              'visit_follow_ups': 'VISIT_READ',
              'attachment_list': 'ATTACHMENT_READ',
              'attachment_archived_list': 'ATTACHMENT_READ',
              'attachment_import': 'ATTACHMENT_WRITE',
              'attachment_archive': 'ATTACHMENT_WRITE',
              'attachment_restore': 'ATTACHMENT_WRITE',
              'scheduling_settings_get': 'SCHEDULE_READ',
              'scheduling_settings_update': 'SCHEDULE_WRITE',
              'closure_list': 'SCHEDULE_READ',
              'closure_create': 'SCHEDULE_WRITE',
              'closure_delete': 'SCHEDULE_WRITE',
              'backup_create': 'BACKUP_CREATE',
              'backup_restore': 'BACKUP_RESTORE',
              'audit_recent': 'AUDIT_READ',
          }

          def find_matching(source, start, opening, closing):
              depth = 0
              for i in range(start, len(source)):
                  if source[i] == opening:
                      depth += 1
                  elif source[i] == closing:
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit(f'unmatched {opening} at {start}')

          for name, capability in capabilities.items():
              marker = f'fn {name}('
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'command not found: {name}')
              paren_start = start + len(marker) - 1
              paren_end = find_matching(text, paren_start, '(', ')')
              params = text[paren_start + 1:paren_end]
              if 'actor_token: Option<String>' not in params:
                  if 'db: tauri::State<Db>,' in params:
                      params = params.replace(
                          'db: tauri::State<Db>,',
                          'db: tauri::State<Db>,\n    actor_token: Option<String>,',
                          1,
                      )
                  elif 'db: tauri::State<Db>' in params:
                      params = params.replace(
                          'db: tauri::State<Db>',
                          'db: tauri::State<Db>,\n    actor_token: Option<String>',
                          1,
                      )
                  else:
                      raise SystemExit(f'db parameter not found: {name}')
                  text = text[:paren_start + 1] + params + text[paren_end:]
                  paren_end = paren_start + 1 + len(params)
              body_start = text.find('{', paren_end)
              if body_start < 0:
                  raise SystemExit(f'body not found: {name}')
              statement = f'\n    authorize_command(&db, actor_token.as_deref(), authorization::{capability})?;'
              lookahead = text[body_start:body_start + 350]
              if f'authorization::{capability}' not in lookahead:
                  text = text[:body_start + 1] + statement + text[body_start + 1:]

          path.write_text(text, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit authorization integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce backend authorization across Tauri commands'
          git push origin HEAD:tauri-react-rebuild
