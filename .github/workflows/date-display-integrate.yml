name: Date Display Integrator
on:
  push:
    branches:
      - tauri-react-rebuild
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/apply-date-display.py
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: node scripts/ui-contract.mjs
      - run: node scripts/audit-label-contract.mjs
      - run: node scripts/appointment-advisory-contract.mjs
      - run: node scripts/two-day-reminder-contract.mjs
      - run: node scripts/full-date-display-contract.mjs
      - name: Commit application integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PatientsPage.tsx src/AppointmentsPage.tsx src/ReadOnlyAppointmentsPage.tsx src/Dashboard.tsx scripts/ui-contract.mjs scripts/full-date-display-contract.mjs
          git commit -m "Unify full Gregorian date display across application"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
