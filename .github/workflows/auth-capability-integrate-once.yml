name: Role capability integration one-shot
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate explicit deputy restore capability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - name: Wire migration and Tauri commands
        shell: python
        run: |
          from pathlib import Path
          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const LATEST_SCHEMA_VERSION: i64 = 15;', 'const LATEST_SCHEMA_VERSION: i64 = 16;', 1)
          migration15 = '''        (
              15,
              include_str!("../migrations/015_attachment_restore_limit.sql"),
          ),
          '''
          migration16 = migration15 + '''        (
              16,
              include_str!("../migrations/016_role_capability_grants.sql"),
          ),
          '''
          if '016_role_capability_grants.sql' not in text:
              if migration15 not in text:
                  raise SystemExit('migration 15 marker not found')
              text = text.replace(migration15, migration16, 1)
          handler_marker = '            auth_commands::user_reset_password,\n'
          additions = (
              '            auth_commands::deputy_restore_permission_get,\n'
              '            auth_commands::deputy_restore_permission_set,\n'
          )
          if 'auth_commands::deputy_restore_permission_get,' not in text:
              if handler_marker not in text:
                  raise SystemExit('auth handler marker not found')
              text = text.replace(handler_marker, handler_marker + additions, 1)
          path.write_text(text, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Wire explicit deputy restore capability'
          git push origin HEAD:tauri-react-rebuild
