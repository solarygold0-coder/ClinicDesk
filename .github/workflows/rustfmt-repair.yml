name: rustfmt-repair
on:
  push:
    branches: [tauri-react-rebuild]
    paths:
      - 'src-tauri/src/patients.rs'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/patients.rs
            git commit -m "style: apply rustfmt to patient activity code"
            git push origin HEAD:tauri-react-rebuild
          fi
