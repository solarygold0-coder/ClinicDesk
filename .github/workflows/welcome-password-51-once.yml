name: welcome-password-51-once
on:
  push:
    branches: [tauri-react-rebuild]
permissions:
  contents: write
concurrency:
  group: welcome-password-51-once
  cancel-in-progress: true
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tauri-react-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply ClinicDesk 5.1 upgrade
        run: python scripts/apply-welcome-password-51.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate frontend and visible behavior
        run: |
          npm install --ignore-scripts
          npm run build
          node scripts/ui-contract.mjs
          node scripts/visible-feature-contract.mjs
          node scripts/windows-package-contract.mjs
      - name: Validate exact-four backend source contract
        run: |
          grep -q 'password.chars().count() != 4' src-tauri/src/auth.rs
          grep -q 'exact-4-v1' src-tauri/migrations/018_exact_four_password_policy.sql
          grep -q 'LATEST_SCHEMA_VERSION: i64 = 18' src-tauri/src/lib.rs
      - name: Validate server service
        run: cargo check -p clinicdesk-server
      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/src/auth.rs src-tauri/src/lib.rs src-tauri/src/migration_tests.rs src-tauri/tests/auth_gate.rs src-tauri/migrations/018_exact_four_password_policy.sql src/App.tsx src/AuthGate.tsx src/UsersPage.tsx src/WelcomeScreen.tsx src/main.tsx src/welcome.css scripts/visible-feature-contract.mjs Cargo.lock
          git commit -m "Upgrade ClinicDesk to 5.1 with welcome and exact four password policy"
          git pull --rebase origin tauri-react-rebuild
          git push origin HEAD:tauri-react-rebuild
